{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block guest_content %}
<div class="min-h-screen flex items-center justify-center px-4">
  <div class="bg-white shadow-xl rounded-2xl p-8 w-full max-w-sm">
    <div class="flex flex-col items-center mb-6">
      <img src="{{ url_for('static', filename=logo_filename) }}" alt="Custodio Water" class="w-16 h-16 rounded-full object-cover mb-2 bg-aqua-100" onerror="this.onerror=null;this.style.display='none';">
      <h1 class="text-xl font-bold text-aqua-700 leading-tight">CUSTODIO WATER<br><span class="text-sm font-semibold">REFILLING STATION</span></h1>
      <p class="text-sm text-gray-500">Purok 6 Malineng, Cuyapo N.E. - Refilling Station System</p>
    </div>
    <form method="POST" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <input type="email" name="email" required class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-aqua-400" placeholder="owner@custudio.com">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input type="password" name="password" required class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-aqua-400" placeholder="••••••••">
      </div>
      <button type="submit" class="w-full bg-aqua-500 hover:bg-aqua-600 text-white font-semibold py-2 rounded-lg transition">Login</button>
    </form>
    <p class="text-xs text-gray-300 text-center mt-4">Developed by Moises Orio Gamboa</p>
  </div>
</div>
{% include "_christmas_snow.html" %}
{% endblock %}

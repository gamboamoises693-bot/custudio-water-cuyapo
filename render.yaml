services:
  - type: web
    name: custudio-water-cuyapo
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    # --timeout 120 (default is 30s) - a promo video upload from the Video
    # Playlist admin page over mobile data can easily take longer than 30s
    # to reach Firebase Storage; without this, gunicorn kills the worker
    # mid-upload and the request just dies with a 502.
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120"
    envVars:
      - key: FIREBASE_CRED_JSON
        sync: false
      - key: FIREBASE_STORAGE_BUCKET
        sync: false
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_PASSWORD
        sync: false
